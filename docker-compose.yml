services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 22-alpine
    image: controle-viaturas-das:latest
    ports:
      - "${APP_PORT:-7000}:7000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-altere-esta-chave-em-producao}
    restart: unless-stopped
  