services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 22-alpine
    image: controle-viaturas-das:latest
    ports:
      - "${APP_PORT:-7000}:7000"
    environment:
      DATABASE_URL: "file:/data/app.db"
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-altere-esta-chave-em-producao}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@das.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      RUN_DB_SEED: ${RUN_DB_SEED:-true}
    volumes:
      - app-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:7000/',(r)=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  app-data:
